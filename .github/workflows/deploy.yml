name: Deploy Eternity

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Build and push Migrator image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migrator
          push: true
          tags: ucyenyen/eternity-migrator:latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ucyenyen/eternity:latest
          build-args: |
            NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
            NEXT_PUBLIC_SOKETI_HOST=${{ secrets.NEXT_PUBLIC_SOKETI_HOST }}
            NEXT_PUBLIC_SOKETI_PORT=${{ secrets.NEXT_PUBLIC_SOKETI_PORT }}
            NEXT_PUBLIC_SOKETI_TLS=${{ secrets.NEXT_PUBLIC_SOKETI_TLS }}
            DATABASE_URL=${{ secrets.DATABASE_URL }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd /var/www/websites/Eternity
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "ucyenyen" --password-stdin
            git fetch
            git pull origin main
            docker compose pull app
            docker compose up -d
            docker image prune -f