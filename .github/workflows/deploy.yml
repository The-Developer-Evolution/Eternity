name: CI/CD Build and Push

on:
  push:
    branches: [ main ] 
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Image Name
        id: prep
        run: |
          REPO_LOWER=${GITHUB_REPOSITORY@L}
          echo "repo_lower=${REPO_LOWER}" >> $GITHUB_OUTPUT

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.prep.outputs.repo_lower }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args:
            PUSHER_APP_ID=build_placeholder
            PUSHER_KEY=build_placeholder
            PUSHER_SECRET=build_placeholder
            PUSHER_CLUSTER=ap1
            DATABASE_URL=postgresql://db:db@localhost:5432/db