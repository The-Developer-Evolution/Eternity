name: Deploy Bry's Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            # Update this path to your project directory on the VPS
            cd /var/www/websites/Eternity
            
            echo "Deploying update..."
            
            # Pull the latest changes from the repository
            git pull origin main
            
            # Build and deploy using Docker Compose
            # This handles migrations (via depends_on: migrate) and app restart
            docker compose build --no-cache && docker compose up -d
            
            # Cleanup unused images to save disk space
            docker image prune -f
            
            echo "Deployment success!"