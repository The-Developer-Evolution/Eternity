name: CI/CD Deploy

on:
  push:
    branches: [ felix ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Lowercase Repo Name
        run: |
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:felix
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_PUSHER_KEY=${{ secrets.NEXT_PUBLIC_PUSHER_KEY }}
            NEXT_PUBLIC_PUSHER_CLUSTER=${{ secrets.NEXT_PUBLIC_PUSHER_CLUSTER }}
            NEXT_PUBLIC_SOKETI_HOST=${{ secrets.NEXT_PUBLIC_SOKETI_HOST }}
            NEXT_PUBLIC_SOKETI_PORT=${{ secrets.NEXT_PUBLIC_SOKETI_PORT }}
            NEXT_PUBLIC_SOKETI_TLS=${{ secrets.NEXT_PUBLIC_SOKETI_TLS }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Copy docker-compose.yml via SSH
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST_FELIX }}
          username: ${{ secrets.SSH_USER_FELIX }}
          key: ${{ secrets.SSH_PRIVATE_KEY_FELIX }}
          source: "./docker-compose.yml"
          target: "/home/deployer/lunchcart"

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST_FELIX }}
          username: ${{ secrets.SSH_USER_FELIX }}
          key: ${{ secrets.SSH_PRIVATE_KEY_FELIX }}
          script: |
            cd /home/deployer/lunchcart

            # Login to GHCR on the VPS
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Pull the latest image
            docker compose pull
            
            # Restart containers with the new image
            docker compose up -d
            
            # Optional: Clean up old images to save disk space
            docker image prune -f