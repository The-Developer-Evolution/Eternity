services:
  migrate_reset:
    image: ucyenyen/eternity-migrator:latest
    container_name: eternity_migrate_reset
    command: pnpm prisma migrate reset --force
    env_file:
      - .env
    networks:
      - global_proxy
      - eternity_internal
    profiles:
      - manual

  seed:
    image: ucyenyen/eternity-migrator:latest
    container_name: eternity_seed
    command: /bin/sh -c "pnpm prisma generate && pnpm tsx prisma/seed.ts"
    env_file:
      - .env
    networks:
      - global_proxy
      - eternity_internal
    profiles:
      - manual

  studio:
    image: ucyenyen/eternity-migrator:latest
    container_name: eternity-studio
    command: /bin/sh -c "pnpm prisma generate && pnpm prisma studio --port 5555"
    env_file:
      - .env
    ports:
      - "5556:5555"
    networks:
      - global_proxy
      - eternity_internal
    profiles:
      - manual

  app:
    # UPDATED: Use the pre-built image from Docker Hub instead of building locally
    image: ucyenyen/eternity:latest
    container_name: eternity
    restart: always
    env_file:
      - .env
    expose:
      - "3000"
    networks:
      - global_proxy
      - eternity_internal

networks:
  global_proxy:
    external: true
  eternity_internal:
    driver: bridge
