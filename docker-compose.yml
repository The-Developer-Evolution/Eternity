services:
  migrate:
    build:
      context: ./
      dockerfile: Dockerfile
      target: migrator
    container_name: eternity-migration
    env_file:
      - .env
    networks:
      - global_proxy
      - eternity_internal
    depends_on:
      db:
        condition: service_started

  migrate_reset:
    build:
      context: ./
      dockerfile: Dockerfile
      target: migrator
    container_name: eternity-migrate-reset
    command: pnpm prisma migrate reset --force
    env_file:
      - .env
    networks:
      - global_proxy
      - eternity_internal
    depends_on:
      db:
        condition: service_started
    profiles:
      - manual

  seeder:
    build:
      context: ./
      dockerfile: Dockerfile
      target: migrator
    container_name: eternity-seeder
    command: pnpm prisma db seed
    env_file:
      - .env
    networks:
      - global_proxy
      - eternity_internal
    depends_on:
      db:
        condition: service_started
    profiles:
      - manual

  db:
    image: postgres:15-alpine
    container_name: eternity_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT_EXTERNAL}:5432"
    networks:
      - eternity_internal
  studio:
    build:
      context: ./
      dockerfile: Dockerfile
      target: migrator
    container_name: eternity-studio
    command: pnpm prisma studio --port 5555 --hostname 0.0.0.0
    env_file:
      - .env
    ports:
      - "5555:5555"
    networks:
      - global_proxy
      - eternity_internal
    depends_on:
      db:
        condition: service_started
    profiles:
      - manual

  app:
    build:
      context: ./
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_PUSHER_KEY=${NEXT_PUBLIC_PUSHER_KEY}
        - NEXT_PUBLIC_SOKETI_HOST=${NEXT_PUBLIC_SOKETI_HOST}
        - NEXT_PUBLIC_SOKETI_PORT=${NEXT_PUBLIC_SOKETI_PORT}
        - NEXT_PUBLIC_SOKETI_TLS=${NEXT_PUBLIC_SOKETI_TLS}
    container_name: eternity
    env_file:
      - ./.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_started
    expose:
      - "3000"
    networks:
      - global_proxy
      - eternity_internal

networks:
  global_proxy:
    external: true
  eternity_internal:
    driver: bridge

volumes:
  pg_data:
