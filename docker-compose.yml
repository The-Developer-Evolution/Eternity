services:
  migrate:
    build:
      context: ./
      dockerfile: Dockerfile
      target: migrator
    container_name: eternity-migration
    env_file:
      - .env.prod
    networks:
      - npm_default

  d-stream:
    build:
      context: ./
      dockerfile: Dockerfile
      target: runner
    container_name: eternity
    env_file:
      - ./.env.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - npm_default

networks:
  npm_default:
    external: true
