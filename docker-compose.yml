services:
  migrate:
    build:
      context: ./
      dockerfile: Dockerfile
      target: migrator
    container_name: eternity-migration
    env_file:
      - .env.prod
    networks:
      - npm_default

  seeder:
    build:
      context: ./
      dockerfile: Dockerfile
      target: migrator
    container_name: eternity-seeder
    command: pnpm prisma db seed
    env_file:
      - .env.prod
    networks:
      - npm_default

  app:
    build:
      context: ./
      dockerfile: Dockerfile
      target: runner
      args:
        - NEXT_PUBLIC_PUSHER_KEY=${NEXT_PUBLIC_PUSHER_KEY}
        - NEXT_PUBLIC_SOKETI_HOST=${NEXT_PUBLIC_SOKETI_HOST}
        - NEXT_PUBLIC_SOKETI_PORT=${NEXT_PUBLIC_SOKETI_PORT}
        - NEXT_PUBLIC_SOKETI_TLS=${NEXT_PUBLIC_SOKETI_TLS}
    container_name: eternity
    env_file:
      - ./.env.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    networks:
      - npm_default

networks:
  npm_default:
    external: true
